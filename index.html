<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLDS - BLACKLIGHTDOMS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Times New Roman",serif;
}

body{
background:#000;
color:#fff;
overflow-x:hidden;
text-shadow:
0 0 4px rgba(255,255,255,.5),
0 0 8px rgba(255,255,255,.25);
}

.container{
width:100%;
max-width:700px;
min-height:100vh;
margin:auto;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px 20px 50px;
}

/* LOGO */
.logo{
width:150px;
margin-top:25px;
animation:float 4s ease-in-out infinite;
filter:
drop-shadow(0 0 4px rgba(255,255,255,.35))
drop-shadow(0 0 8px rgba(255,255,255,.25));
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}
}

.title{
margin-top:18px;
font-size:28px;
font-weight:600;
letter-spacing:3px;
text-align:center;
text-shadow:
0 0 6px rgba(255,255,255,.9),
0 0 12px rgba(255,255,255,.5),
0 0 25px rgba(255,255,255,.2);
}

.subtitle{
margin-top:8px;
font-size:13px;
letter-spacing:8px;
opacity:.55;
text-transform:uppercase;
text-align:center;
}

/* CHAPTER */
.chapter-list{
width:100%;
max-width:320px;
margin-top:50px;
}

.chapter{
margin-bottom:16px;
}

.chapter-btn{
width:100%;
padding:12px;
font-size:15px;
letter-spacing:2px;
color:white;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.15);
cursor:pointer;
transition:.35s;
backdrop-filter:blur(8px);
}

.chapter-btn:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.08);
border-color:rgba(255,255,255,.4);
box-shadow:0 0 8px rgba(255,255,255,.2);
}

/* TRANSITION */
#transition{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
pointer-events:none;
transition:1s;
z-index:9999;
}

#transition.active{
opacity:1;
pointer-events:all;
}

.loading{
font-size:15px;
letter-spacing:5px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:.25;}
50%{opacity:1;}
100%{opacity:.25;}
}

.light-line{
width:180px;
height:1px;
background:white;
margin-top:15px;
box-shadow:0 0 10px white;
animation:lineGlow 2s infinite;
}

@keyframes lineGlow{
0%{opacity:.2;}
50%{opacity:1;}
100%{opacity:.2;}
}
</style>
</head>

<body>

<div id="transition">
<div class="loading">LOADING CHAPTER</div>
<div class="light-line"></div>
</div>

<div class="container">

<img src="logo.png" class="logo">

<div class="title">BLACKLIGHTDOMS</div>
<div class="subtitle">Novel</div>

<div class="chapter-list">

<button class="chapter-btn" onclick="openChapter(1)">CHAPTER 1</button>
<button class="chapter-btn" onclick="openChapter(2)">CHAPTER 2</button>
<button class="chapter-btn" onclick="openChapter(3)">CHAPTER 3</button>
<button class="chapter-btn" onclick="openChapter(4)">CHAPTER 4</button>
<button class="chapter-btn" onclick="openChapter(5)">CHAPTER 5</button>

</div>

</div>

<script>
function openChapter(num){
const transition=document.getElementById("transition");
transition.classList.add("active");

document.querySelector(".loading").innerText =
"LOADING CHAPTER " + roman(num);

setTimeout(()=>{
window.location.href="chapter"+num+".html";
},1500);
}

function roman(num){
const map={1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII",8:"VIII",9:"IX",10:"X"};
return map[num]||num;
}
</script>

</body>
</html>
