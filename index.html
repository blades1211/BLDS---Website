<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond The Fragment</title>
    <style>
        :root {
            --bg-color: #070707;
            --text-color: #dcdcdc;
            --accent-color: #ffffff;
            --glow: 0 0 12px rgba(255, 255, 255, 0.25);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Georgia", serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            max-width: 130px;
            margin-bottom: 20px;
            filter: drop-shadow(var(--glow));
        }

        h1 {
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--accent-color);
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 6px;
            color: #888;
            text-transform: uppercase;
        }

        .symbol {
            font-size: 20px;
            color: var(--accent-color);
            margin: 30px 0;
            text-shadow: var(--glow);
            animation: pulse 2.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; text-shadow: 0 0 4px rgba(255,255,255,0.2); }
            to { opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.6); }
        }

        .begin-btn {
            display: inline-block;
            padding: 14px 28px;
            margin-bottom: 40px;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            text-decoration: none;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: var(--glow);
        }

        .begin-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .chapter-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 60px;
        }

        .chapter-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: transparent;
            border: 1px solid #222;
            color: var(--text-color);
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .chapter-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: var(--glow);
        }

        .ch-num {
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #777;
            display: block;
            margin-bottom: 5px;
        }

        .ch-title {
            font-size: 16px;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            border-top: 1px solid #222;
            width: 100%;
            padding-top: 30px;
            padding-bottom: 20px;
        }

        .footer a {
            color: #666;
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Beyond The Fragment Logo" class="logo">
            <h1>Beyond The Fragment</h1>
            <div class="subtitle">A Fictional Novel</div>
            <div class="symbol">♦</div>
        </div>

        <a href="chapter1.html" class="begin-btn">BEGIN READING</a>

        <div class="chapter-list">
            <a href="chapter1.html" class="chapter-btn">
                <span class="ch-num">CHAPTER I</span>
                <span class="ch-title">THE UNSEEN BOY</span>
            </a>
            <a href="chapter2.html" class="chapter-btn">
                <span class="ch-num">CHAPTER II</span>
                <span class="ch-title">THE AWAKENING</span>
            </a>
            <a href="chapter3.html" class="chapter-btn">
                <span class="ch-num">CHAPTER III</span>
                <span class="ch-title">THE VOICE BEYOND DARKNESS</span>
            </a>
            <a href="chapter4.html" class="chapter-btn">
                <span class="ch-num">CHAPTER IV</span>
                <span class="ch-title">THE CORE</span>
            </a>
            <a href="chapter5.html" class="chapter-btn">
                <span class="ch-num">CHAPTER V</span>
                <span class="ch-title">THE FIRST PURSUIT</span>
            </a>
        </div>

        <div class="footer">
            <a href="https://discord.gg/r4dM4QFteV" target="_blank">DISCORD</a>
            <a href="https://chat.whatsapp.com/LYhSQn3vXhO6qpVWyoJEoR?s=cl&p=a&ilr=1" target="_blank">WHATSAPP</a>
        </div>
    </div>
</body>
</html>
